name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: coverage gate
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          # The registry speaks four package-manager protocols; a drop here
          # means one of them lost its test.
          awk -v t="$total" 'BEGIN { exit (t < 78) }' || {
            echo "coverage ${total}% is below the 78% floor"; exit 1; }

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "protobuf>=5.27"
      - name: install toolchain
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          # protoc_builtin: php in the example template drives protoc directly
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: publish and consume through real package managers
        run: ./e2e/e2e.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: protobuffet:ci
