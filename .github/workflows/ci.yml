name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-compile every released platform
        # A release tag is a poor place to discover that the CLI does not
        # build for Windows.
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/buffet ./cmd/buffetd
          done
          for target in windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/buffet
          done
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: coverage gate
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          # The registry speaks four package-manager protocols; a drop here
          # means one of them lost its test.
          awk -v t="$total" 'BEGIN { exit (t < 80) }' || {
            echo "coverage ${total}% is below the 80% floor"; exit 1; }

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "protobuf>=5.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @bufbuild/protoc-gen-es
      - name: install toolchain
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          # protoc_builtin: php in the example template drives protoc directly
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: publish and consume through real package managers
        run: ./e2e/e2e.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: protobuffet:ci
      - name: the image actually runs
        run: |
          set -x
          # No -v: this is the command in the README, and an anonymous volume
          # must not leave the server unable to write its data directory.
          docker run -d --name pb -p 8080:8080 -e BUFFET_ADMIN_TOKEN=ci-token protobuffet:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8080/healthz && break
            sleep 1
          done
          if ! curl -sf localhost:8080/healthz; then
            echo "::error::the image did not become healthy; container log follows"
            docker logs pb || true
            docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' pb || true
            exit 1
          fi
          # buf ships in the image; without it the compatibility gate cannot start
          docker exec pb /usr/local/bin/buf --version
          # The server logs to stderr; piping only stdout finds nothing.
          docker logs pb 2>&1 | grep -q "compatibility checks enabled"
          # Readiness is what the deployment probes; a green liveness with a
          # broken volume would still take traffic.
          curl -sf localhost:8080/readyz | grep -q '"ready": true'
          curl -sf localhost:8080/version | grep -q '"buf"' 
          # And with a mounted volume, which is how it runs in production.
          docker rm -f pb
          docker volume create pbdata
          docker run -d --name pb2 -p 8081:8080 -v pbdata:/data -e BUFFET_ADMIN_TOKEN=ci-token protobuffet:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8081/healthz && break
            sleep 1
          done
          if ! curl -sf localhost:8081/healthz; then
            echo "::error::the image did not become healthy on a named volume"
            docker logs pb2 || true
            exit 1
          fi
          docker rm -f pb2
