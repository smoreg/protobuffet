version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: buffet
    main: ./cmd/buffet
    binary: buffet
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: buffetd
    main: ./cmd/buffetd
    binary: buffetd
    env: [CGO_ENABLED=0]
    # The server is only supported on Unix: it relies on directory fsync and
    # rename-over-existing semantics.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

# Two archives rather than one: the server is not built for Windows, and an
# archive whose contents differ per platform is a surprise when unpacked.
archives:
  - id: cli
    ids: [buffet]
    name_template: "buffet_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, docs/*]
  - id: server
    ids: [buffetd]
    name_template: "buffetd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [README.md, LICENSE, buffetd.example.yaml, docs/*]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^Add '
      order: 0
    - title: Fixes
      regexp: '^(Fix|Refuse|Reject|Close) '
      order: 1
    - title: Other
      order: 2

release:
  footer: |
    Container image: `ghcr.io/smoreg/protobuffet:{{ .Tag }}`
