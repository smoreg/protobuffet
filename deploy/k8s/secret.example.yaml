# Generate token digests with: buffet token
# Then create the real secret (do not commit it):
#   kubectl -n schema-registry create secret generic protobuffet-config \
#     --from-file=buffetd.yaml=./buffetd.yaml
apiVersion: v1
kind: Secret
metadata:
  name: protobuffet-config
stringData:
  buffetd.yaml: |
    listen: ":8080"
    data: "/data"
    base_url: "https://schemas.example.com"
    public_read: true
    breaking_check: required
    breaking_policy: strict
    tokens:
      - subject: ci
        sha256: "replace-with-the-digest-buffet-token-prints"
        scopes: [write]
