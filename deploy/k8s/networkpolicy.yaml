apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protobuffet
spec:
  podSelector:
    matchLabels: {app: protobuffet}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        # CI runners publish straight to the Service, skipping the ingress.
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ci}
      ports:
        - {protocol: TCP, port: 8080}
