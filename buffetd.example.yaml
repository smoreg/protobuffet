# protobuffet server configuration. Every field has a default, so the shortest
# working deployment is no file at all plus BUFFET_ADMIN_TOKEN in the env.

listen: ":8080"
data: "./data"

# Leave empty to derive download URLs from the incoming request. Set it when a
# proxy rewrites the Host header, or when serving on a path prefix.
base_url: ""

# Anyone can read schemas and SDKs; publishing always needs a token.
# Set to false for a fully private registry.
public_read: true

# The compatibility gate:
#   required     refuse to start without buf, refuse any publish that cannot be
#                checked, refuse breaking changes. The default.
#   best-effort  check when possible, publish with a warning when buf is missing
#   off          no checking
breaking_check: required

# Limits. A publish holds its artifacts in memory and runs buf, so both of
# these bound peak memory on the node.
max_upload_bytes: 134217728       # 128 MiB per request
max_concurrent_publishes: 4

# Mint credentials with: buffet token
tokens:
  - subject: ci
    sha256: "replace-me-with-the-digest-buffet-token-prints"
    scopes: [write]
  - subject: developer
    sha256: "another-digest"
    scopes: [read]
